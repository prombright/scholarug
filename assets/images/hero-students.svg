<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="Students learning on laptops with ScholarUg">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3FAFA"/>
      <stop offset="100%" stop-color="#E4F3F2"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D9C3"/>
      <stop offset="100%" stop-color="#D9C6A8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="700" fill="url(#bgGrad)"/>

  <!-- ambient background texture: soft dots, a window, a shelf -->
  <g opacity="0.5">
    <circle cx="120" cy="110" r="5" fill="#00A8A8"/>
    <circle cx="180" cy="90" r="3.5" fill="#0A3D62"/>
    <circle cx="1500" cy="150" r="5" fill="#00A8A8"/>
    <circle cx="1450" cy="200" r="3.5" fill="#0A3D62"/>
    <circle cx="1540" cy="90" r="3.5" fill="#0A3D62"/>
    <circle cx="60" cy="220" r="3.5" fill="#00A8A8"/>
  </g>

  <g opacity="0.55">
    <rect x="60" y="60" width="170" height="130" rx="14" fill="none" stroke="#0A3D62" stroke-width="4"/>
    <line x1="145" y1="60" x2="145" y2="190" stroke="#0A3D62" stroke-width="4"/>
    <line x1="60" y1="125" x2="230" y2="125" stroke="#0A3D62" stroke-width="4"/>
  </g>

  <!-- shelf with books, right side -->
  <g opacity="0.6">
    <rect x="1360" y="140" width="200" height="10" rx="4" fill="#0A3D62"/>
    <rect x="1372" y="80" width="24" height="60" rx="3" fill="#00A8A8"/>
    <rect x="1400" y="70" width="24" height="70" rx="3" fill="#0A3D62"/>
    <rect x="1428" y="86" width="24" height="54" rx="3" fill="#F4B860"/>
    <rect x="1456" y="76" width="24" height="64" rx="3" fill="#00A8A8"/>
    <rect x="1484" y="90" width="24" height="50" rx="3" fill="#0A3D62"/>
  </g>

  <!-- long shared desk -->
  <rect x="0" y="452" width="1600" height="30" fill="url(#deskGrad)"/>
  <rect x="0" y="478" width="1600" height="10" fill="#C9B394"/>

  <!-- potted plant between students 1 and 2 -->
  <g transform="translate(555,275)">
    <rect x="-32" y="115" width="64" height="50" rx="10" fill="#0A3D62"/>
    <path d="M0 118 C -6 70 -46 50 -56 6 C -14 18 2 62 6 110 Z" fill="#2FA88C"/>
    <path d="M0 118 C 6 60 50 44 62 -6 C 18 8 0 58 -4 112 Z" fill="#3EC6A6"/>
    <path d="M0 118 C -2 56 -2 10 -14 -32 C 20 -14 14 48 10 114 Z" fill="#24916F"/>
  </g>

  <!-- ================= STUDENT 1 ================= -->
  <g transform="translate(300,0)">
    <ellipse cx="0" cy="470" rx="95" ry="16" fill="#0A3D62" opacity="0.08"/>
    <!-- torso -->
    <rect x="-75" y="330" width="150" height="150" rx="46" fill="#00A8A8"/>
    <!-- arms, drawn before the laptop so hands tuck behind its edges -->
    <path d="M-60 355 Q -95 390 -62 428" stroke="#00A8A8" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M60 355 Q 95 390 62 428" stroke="#00A8A8" stroke-width="30" fill="none" stroke-linecap="round"/>
    <circle cx="-64" cy="430" r="14" fill="#C98A5B"/>
    <circle cx="64" cy="430" r="14" fill="#C98A5B"/>
    <!-- neck -->
    <rect x="-16" y="285" width="32" height="40" rx="12" fill="#C98A5B"/>
    <!-- head -->
    <circle cx="0" cy="250" r="58" fill="#C98A5B"/>
    <!-- hair: short rounded crop -->
    <path d="M-58 235 C -66 150 66 150 58 235 C 40 195 -40 195 -58 235 Z" fill="#241914"/>
    <!-- simple face -->
    <circle cx="-20" cy="252" r="6" fill="#241914"/>
    <circle cx="20" cy="252" r="6" fill="#241914"/>
    <path d="M-16 276 Q0 288 16 276" stroke="#241914" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- laptop: sits on the desk, well below chin height -->
    <g transform="translate(0,452)">
      <rect x="-62" y="0" width="124" height="9" rx="3" fill="#DCE7EA"/>
      <rect x="-58" y="-80" width="116" height="80" rx="8" fill="#0A3D62"/>
      <rect x="-50" y="-72" width="100" height="64" rx="5" fill="#0E2F3F"/>
      <rect x="-32" y="-46" width="24" height="24" rx="6" fill="#00D6C6"/>
      <path d="M-24 -36 l5 5 l9 -11" stroke="#0A3D62" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="2" y="-32" font-family="Poppins, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Scholar<tspan fill="#00D6C6">Ug</tspan></text>
    </g>
  </g>

  <!-- ================= STUDENT 2 (center, focal) ================= -->
  <g transform="translate(800,-18)">
    <ellipse cx="0" cy="488" rx="105" ry="17" fill="#0A3D62" opacity="0.08"/>
    <rect x="-82" y="338" width="164" height="160" rx="50" fill="#0A3D62"/>
    <path d="M-64 368 Q -104 405 -68 462" stroke="#0A3D62" stroke-width="32" fill="none" stroke-linecap="round"/>
    <path d="M64 368 Q 104 405 68 462" stroke="#0A3D62" stroke-width="32" fill="none" stroke-linecap="round"/>
    <circle cx="-70" cy="464" r="15" fill="#8A5A34"/>
    <circle cx="70" cy="464" r="15" fill="#8A5A34"/>
    <rect x="-17" y="288" width="34" height="42" rx="13" fill="#8A5A34"/>
    <circle cx="0" cy="252" r="62" fill="#8A5A34"/>
    <!-- hair: rounded afro -->
    <path d="M-64 258 A64 64 0 1 1 64 258 C 60 190 -60 190 -64 258 Z" fill="#1B120D"/>
    <circle cx="-22" cy="256" r="6.5" fill="#1B120D"/>
    <circle cx="22" cy="256" r="6.5" fill="#1B120D"/>
    <path d="M-18 282 Q0 296 18 282" stroke="#1B120D" stroke-width="5.2" fill="none" stroke-linecap="round"/>

    <g transform="translate(0,470)">
      <rect x="-68" y="0" width="136" height="10" rx="3" fill="#DCE7EA"/>
      <rect x="-64" y="-88" width="128" height="88" rx="9" fill="#00A8A8"/>
      <rect x="-55" y="-79" width="110" height="70" rx="6" fill="#053B3A"/>
      <text x="0" y="-38" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">ScholarUg</text>
      <path d="M-16 -25 L-6 -25 L0 -33 L6 -25 L16 -25 L8 -18 L10 -8 L0 -14 L-10 -8 L-8 -18 Z" fill="#00D6C6" opacity="0.9"/>
    </g>
  </g>

  <!-- ================= STUDENT 3 ================= -->
  <g transform="translate(1300,0)">
    <ellipse cx="0" cy="470" rx="95" ry="16" fill="#0A3D62" opacity="0.08"/>
    <rect x="-75" y="330" width="150" height="150" rx="46" fill="#F4B860"/>
    <path d="M-60 355 Q -95 390 -62 428" stroke="#F4B860" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M60 355 Q 95 390 62 428" stroke="#F4B860" stroke-width="30" fill="none" stroke-linecap="round"/>
    <circle cx="-64" cy="430" r="14" fill="#E8B48C"/>
    <circle cx="64" cy="430" r="14" fill="#E8B48C"/>
    <rect x="-16" y="285" width="32" height="40" rx="12" fill="#E8B48C"/>
    <circle cx="0" cy="250" r="58" fill="#E8B48C"/>
    <!-- hair: bun -->
    <path d="M-56 232 C -60 168 56 168 56 232 C 40 198 -40 198 -56 232 Z" fill="#4A3222"/>
    <circle cx="0" cy="176" r="20" fill="#4A3222"/>
    <circle cx="-20" cy="252" r="6" fill="#4A3222"/>
    <circle cx="20" cy="252" r="6" fill="#4A3222"/>
    <path d="M-16 276 Q0 286 16 276" stroke="#4A3222" stroke-width="5" fill="none" stroke-linecap="round"/>

    <g transform="translate(0,452)">
      <rect x="-62" y="0" width="124" height="9" rx="3" fill="#DCE7EA"/>
      <rect x="-58" y="-80" width="116" height="80" rx="8" fill="#0A3D62"/>
      <rect x="-50" y="-72" width="100" height="64" rx="5" fill="#0E2F3F"/>
      <circle cx="0" cy="-40" r="15" fill="none" stroke="#00D6C6" stroke-width="2.6"/>
      <path d="M0 -52 L3.5 -43 L13 -43 L5.5 -37 L8 -28 L0 -34 L-8 -28 L-5.5 -37 L-13 -43 L-3.5 -43 Z" fill="#00D6C6"/>
    </g>
  </g>

</svg>
