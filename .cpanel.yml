---
deployment:
  tasks:
    - export DEPLOYPATH=/home/scholaru/public_html/
    # Reverted from rsync back to cp -- rsync may not be installed on this
    # specific host, which would make every deploy fail outright rather
    # than just be slow. cp is guaranteed present. The bare `*` glob still
    # never matches dotfiles (.htaccess included), so that's copied
    # explicitly on its own line.
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
